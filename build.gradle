plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.141'
}

version = mod_version
group = mod_group_id

base {
    archivesName = "Blockified-engine-NeoForge-${minecraft_version}"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Sandboxed Lua 5.x runtime for Psych Engine script compatibility.
    // Bundle it: players should only need this mod jar, not a separate Lua mod.
    jarJar(implementation("org.luaj:luaj-jse:3.0.1")) {
        version {
            strictly '[3.0,4.0)'
            prefer '3.0.1'
        }
    }
    // Frame-rate-independent note input uses org.lwjgl.system.windows.User32
    // (GetAsyncKeyState) from LWJGL, which Minecraft already ships — no bundled
    // dependency, so nothing can clash on the module path.
}

neoForge {
    version = project.neo_version

    parchment {
        // Using official Mojang mappings only
    }

    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

def generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    def replaceProperties = [
            minecraft_version: minecraft_version,
            neo_version      : neo_version,
            mod_id           : mod_id,
            mod_name         : mod_name,
            mod_version      : mod_version,
            mod_authors      : mod_authors,
            mod_description  : mod_description
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata
